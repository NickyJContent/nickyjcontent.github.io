<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NickyJ Content</title>
<meta name="description" content="Home of NickyJ Content channels, including Far Window Sounds.">
<style>
:root{--bg:#f5f3ef;--fg:#1d2430;--muted:#5b6472;--card:#ffffff;--line:#e2ddd4;--accent:#3b5b7a}
@media (prefers-color-scheme:dark){:root{--bg:#141820;--fg:#e6e8ec;--muted:#9aa3b2;--card:#1c222c;--line:#2b3340;--accent:#8fb3d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:680px;margin:0 auto;padding:64px 20px}
h1{font-size:2.2rem;margin:0 0 8px;font-weight:normal;letter-spacing:.01em}
.lede{color:var(--muted);margin:0 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}
.card h2{margin:0 0 6px;font-size:1.3rem;font-weight:normal}
.card p{margin:0 0 12px;color:var(--muted)}
a{color:var(--accent)}
footer{margin-top:48px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>NickyJ Content</h1>
<p class="lede">A small family of YouTube channels.</p>
<section class="card">
<h2>Far Window Sounds</h2>
<p>Every video is a view through a window somewhere in the world. Long, calm soundscapes for sleep, study and slowing down.</p>
<a href="https://www.youtube.com/@FarWindowSounds">Watch on YouTube</a>
</section>
<footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
